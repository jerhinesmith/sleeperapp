    themes: ["star_power", "dominance"]

  - text: "Make you mine"
    song: "Make You Mine"
    context: "waiver claim you’re determined to roster"
    themes: ["waivers", "assertiveness"]

  - text: "Nothing can break me"
    song: "Unbreakable"
    context: "team on a heater; top scorer week"
    themes: ["resilience", "confidence", "streaks", "winning_streak"]

  - text: "You're such a lost cause"
    song: "Selfish"
    context: "roasting a team that's completely out of contention"
    themes: ["struggles", "shade"]

  - text: "How you gonna fix this?"
    song: "Selfish"
    context: "calling out a team after a brutal loss"
    themes: ["struggles", "trash_talk"]

  - text: "How could you be so reckless with my heart?"
    song: "Reckless"
    context: "a boneheaded start/sit decision blows up in your face"
